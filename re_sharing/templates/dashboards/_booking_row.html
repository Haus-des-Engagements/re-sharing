<a class="list-group-item list-group-item-action"
   href="{% url "bookings:show-booking" booking.slug %}">
  <div class="d-flex justify-content-between align-items-start gap-2">
    <span>{{ booking.timespan.lower|date:"D d.m." }} · {{ booking.timespan.lower|date:"H:i" }}–{{ booking.timespan.upper|date:"H:i" }}</span>
    <span class="badge flex-shrink-0 text-bg-status-{{ booking.status }}">{{ booking.get_status_display }}</span>
  </div>
  <div class="fw-semibold text-break">{{ booking.title }}</div>
  <div class="small text-body-secondary">{{ booking.resource }} · {{ booking.organization }}</div>
</a>
