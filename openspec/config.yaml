schema: spec-driven

context: |
  Tech stack: Django, Postgres, htmx
  We use conventional commits
  We work trunk based.
  Domain: Booking software


rules:
  proposal:
    - follow the hacksoft django stylguide: https://github.com/HackSoftware/Django-Styleguide
    - Keep proposals under 500 words
    - Always include a "Non-goals" section
  tasks:
    - Break tasks into chunks of max 2 hours
    - always work test-drive (TDD red/green)
    - run the full test suite pre-commit at the end, fix all errors
